name: Chatbot checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Test offline behavior and installed integrations
        run: python -m unittest discover -s tests -v
      - name: Produce dependency lock
        run: |
          pip-compile --strip-extras --output-file=/tmp/requirements.lock requirements.in
          cat /tmp/requirements.lock
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: /tmp/requirements.lock
